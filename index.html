<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b0b0b">
<meta name="description" content="Differente Snack & Grill menu and social media links">
<title>Differente Snack &amp; Grill</title>
<style>
:root{--yellow:#f5d51d;--black:#0b0b0b;--white:#f7f7f2}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;color:var(--white);background:radial-gradient(ellipse at 15% 5%,#24200c 0,transparent 34%),#0b0b0b;font-family:Arial,Helvetica,sans-serif}
header{text-align:center;padding:42px 18px 28px}
.brand{margin:0;font-size:clamp(2.1rem,7vw,4.5rem);line-height:.95;font-weight:900;letter-spacing:.08em}
.brand span,.section-title{color:var(--yellow)}
.subtitle{margin:13px 0 0;letter-spacing:.34em;font-size:.85rem;font-weight:700}
.intro{max-width:680px;margin:18px auto 0;color:#bdbdb7;line-height:1.6}
.section{width:min(100% - 28px,980px);margin:0 auto}
.section-title{text-align:center;margin:24px 0 18px;font-size:1.25rem;letter-spacing:.2em;text-transform:uppercase}
.menus{display:grid;grid-template-columns:1fr;gap:18px;padding-bottom:38px}
.menu-image{display:block;width:100%;height:auto;border:1px solid #393939;border-radius:10px;box-shadow:0 12px 32px #0009;cursor:zoom-in}
.social-section{border-top:1px solid #383838;padding:30px 0 42px;text-align:center}
.social-intro{color:#bdbdb7;margin:-6px 0 20px}
.socials{display:flex;flex-wrap:wrap;justify-content:center;gap:12px}
.social-link{display:flex;align-items:center;justify-content:center;gap:10px;min-width:145px;padding:13px 18px;border:1px solid #4a4a4a;border-radius:8px;color:var(--white);background:#171717;text-decoration:none;font-weight:700;transition:.2s}
.social-link:hover,.social-link:focus-visible{border-color:var(--yellow);color:var(--yellow);transform:translateY(-2px)}
.social-link svg{width:21px;height:21px;fill:currentColor}
footer{border-top:1px solid #292929;padding:18px;color:#8e8e88;text-align:center;font-size:.8rem}
.lightbox{position:fixed;inset:0;z-index:5;display:none;align-items:center;justify-content:center;padding:18px;background:#000e;cursor:zoom-out}
.lightbox.open{display:flex}.lightbox img{max-width:100%;max-height:94vh;object-fit:contain}
@media(min-width:760px){.menus{grid-template-columns:1fr 1fr;align-items:start;gap:22px}}
</style>
</head>
<body>
<header>
<h1 class="brand">DIFFER<span>ENTE</span></h1>
<p class="subtitle">SNACK &amp; GRILL</p>
<p class="intro">Good food. Great taste. Discover our menu and follow Differente Snack &amp; Grill on social media.</p>
</header>
<main>
<section class="section" aria-labelledby="menu-heading">
<h2 class="section-title" id="menu-heading">Our Menu</h2>
<div class="menus">
<img class="menu-image" src="menu-page-1.png" alt="Differente Snack & Grill menu, page 1">
<img class="menu-image" src="menu-page-2.png" alt="Differente Snack & Grill menu, page 2" loading="lazy">
<img class="menu-image" src="menu-page-3.png" alt="Differente Snack & Grill menu, page 3" loading="lazy">
<img class="menu-image" src="menu-page-4.png" alt="Differente Snack & Grill menu, page 4" loading="lazy">
<img class="menu-image" src="menu-page-5.png" alt="Differente Snack & Grill menu, page 5" loading="lazy">
<img class="menu-image" src="menu-page-6.png" alt="Differente Snack & Grill menu, page 6" loading="lazy">
<img class="menu-image" src="menu-page-7.png" alt="Differente Snack & Grill menu, page 7" loading="lazy">
<img class="menu-image" src="menu-page-8.png" alt="Differente Snack & Grill menu, page 8" loading="lazy">
<img class="menu-image" src="menu-page-9.png" alt="Differente Snack & Grill menu, page 9" loading="lazy">
<img class="menu-image" src="menu-page-10.png" alt="Differente Snack & Grill menu, page 10" loading="lazy">
<img class="menu-image" src="menu-page-11.png" alt="Differente Snack & Grill menu, page 11" loading="lazy">
</div>
</section>
<section class="social-section">
<div class="section">
<h2 class="section-title">Follow Us</h2>
<p class="social-intro">Stay connected with Differente Snack &amp; Grill.</p>
<nav class="socials" aria-label="Social media">
<a class="social-link" href="https://www.facebook.com/profile.php?id=61594461189307" target="_blank" rel="noopener noreferrer">f&nbsp; Facebook</a>
<a class="social-link" href="https://www.instagram.com/differente.food" target="_blank" rel="noopener noreferrer">◎&nbsp; Instagram</a>
<a class="social-link" href="https://www.tiktok.com/@diffe.rente" target="_blank" rel="noopener noreferrer">♪&nbsp; TikTok</a>
</nav>
</div>
</section>
</main>
<footer>© <span id="year"></span> Differente Snack &amp; Grill</footer>
<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Expanded menu image"><img id="lightbox-image" alt=""></div>
<script>
document.getElementById('year').textContent=new Date().getFullYear();
const lightbox=document.getElementById('lightbox'),expanded=document.getElementById('lightbox-image');
document.querySelectorAll('.menu-image').forEach(img=>img.addEventListener('click',()=>{expanded.src=img.src;expanded.alt=img.alt;lightbox.classList.add('open')}));
lightbox.addEventListener('click',()=>lightbox.classList.remove('open'));
document.addEventListener('keydown',e=>{if(e.key==='Escape')lightbox.classList.remove('open')});
</script>
</body>
</html>
